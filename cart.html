<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDAL CART</title>
    <link rel="icon" href="VANDAL LOGO.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar nav">

<div class="logo">
<img src="VANDAL LOGO.png" alt="VANDAL Logo">
<span>VANDAL</span>
</div>

<button class="menu-toggle" onclick="toggleMenu()">
<span class="bars"><span></span><span></span><span></span></span>
MENU
</button>

<ul class="nav-links" id="navLinks">
<li><a href="index.html">Home</a></li>
<li><a href="shop.html">Shop</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="cart.html" class="active">Cart</a></li>
<li><a href="unreleased.html">Unreleased</a></li>
</ul>

</nav>

<div class="cart-container" id="cart-container"></div>

<script src="site.js"></script>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

const container =
document.getElementById("cart-container");

function renderCart(){

container.innerHTML = "";

if(cart.length === 0){
container.innerHTML =
'<div class="empty-cart">Your cart is empty. <a href="shop.html">Continue shopping</a></div>';
return;
}

let total = 0;

cart.forEach((item,index)=>{

total += item.price;

container.innerHTML += `

<div class="cart-item">

<img src="${item.image}" loading="lazy">

<div class="cart-item-info">

<h2>${item.name}</h2>

<p>Size: ${item.size}</p>

${item.height ? `<p>Height: ${item.height}</p>` : ""}

<p>Color: ${item.color}</p>

<h3>₦${item.price.toLocaleString("en-NG")}</h3>

</div>

<button class="remove-btn" onclick="removeItem(${index})">
REMOVE
</button>

</div>

`;

});

container.innerHTML += `

<div class="cart-total">
TOTAL: ₦${total.toLocaleString("en-NG")}
</div>

<a href="checkout.html" class="checkout-btn">
CHECKOUT
</a>

`;

}

function removeItem(index){

cart.splice(index,1);

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

renderCart();

}

renderCart();

</script>

</body>
</html>
