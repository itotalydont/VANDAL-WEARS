<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CHECKOUT</title>

<link rel="icon" href="VANDAL LOGO.png">
<link rel="stylesheet" href="style.css">

<script src="https://checkout.flutterwave.com/v3.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

<style>

body{
margin:0;
background:#090909;
font-family:Arial;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#161616;
padding:40px;
border-radius:20px;
width:400px;
}

input,select{
width:100%;
padding:12px;
margin-top:15px;
background:#222;
border:none;
color:white;
border-radius:10px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:red;
color:white;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

.promo-row{
display:flex;
gap:10px;
margin-top:15px;
}

.promo-row input{
margin-top:0;
flex:1;
min-width:0;
}

.promo-row button{
width:auto;
margin-top:0;
padding:12px 18px;
font-size:15px;
white-space:nowrap;
}

.promo-row button:disabled{
opacity:0.5;
cursor:default;
}

#promoMsg{
min-height:16px;
margin-top:8px;
font-size:14px;
}

#total{
line-height:1.5;
}

.confirm-block{
margin-top:18px;
padding:14px 16px;
background:#0d0d0d;
border:1px solid #292929;
border-radius:10px;
text-align:left;
}

.confirm-block p{
margin:0 0 4px;
font-size:12px;
color:#999;
letter-spacing:0.5px;
text-transform:uppercase;
}

.confirm-block h2{
margin:0;
font-size:19px;
color:#ff0000;
word-break:break-all;
}

</style>

</head>

<body>

<div class="box">

<h1>CHECKOUT</h1>

<input type="text" id="firstName" placeholder="First Name">

<input type="text" id="lastName" placeholder="Last Name">

<input type="email" id="email" placeholder="Email">

<input type="text" id="phone" placeholder="Phone Number">

<input type="text" id="address" placeholder="Address">

<select id="delivery">

<option value="6500">
Lagos Island (₦6,500)
</option>

<option value="5000">
Lagos Mainland (₦5,000)
</option>

<option value="0">
Pick Up At Kudoro Estate (FREE)
</option>

<option value="outside">
Outside Lagos (Message Us Directly)
</option>

</select>

<div class="promo-row">
<input type="text" id="promoInput" placeholder="Discount code">
<button id="promoBtn" onclick="applyPromo()">Apply</button>
</div>

<p id="promoMsg"></p>

<h2 id="total"></h2>

<button id="payBtn" onclick="payNow()">
PAY NOW
</button>

</div>

<script src="site.js"></script>

<script>

let cart =
JSON.parse(localStorage.getItem("cart")) || [];

let subtotal = 0;

cart.forEach(item=>{
subtotal += item.price;
});

const delivery =
document.getElementById("delivery");

// ---- EmailJS setup ----
// Sign up free at emailjs.com, connect an email account under
// "Email Services", then create a template under "Email Templates"
// using the variable names sent below (to_email, customer_name,
// order_ref, transaction_id, order_items, order_total,
// delivery_option, address). Paste your 3 IDs here:
emailjs.init({ publicKey: "YOUR_EMAILJS_PUBLIC_KEY" });
const EMAILJS_SERVICE_ID = "YOUR_EMAILJS_SERVICE_ID";
const EMAILJS_TEMPLATE_ID = "YOUR_EMAILJS_TEMPLATE_ID";

// Where YOU get notified with the full order details (color/size/height).
// Change this if you want orders sent to a different inbox.
const SELLER_EMAIL = "wearsvandal@gmail.com";
// ------------------------

// ---- EDIT THIS: your real discount codes ----
// value is either a percentage off (e.g. 0.10 = 10%) or the string "freeship"
const VALID_CODES = {
"WELCOME10": 0.10,
"SAVE20": 0.20,
"FREESHIP": "freeship"
};
// ----------------------------------------------

let discountRate = 0;
let freeShipping = false;
let appliedCode = null;

function applyPromo(){

const input = document.getElementById("promoInput");
const msg = document.getElementById("promoMsg");
const code = input.value.trim().toUpperCase();

if(!code){
msg.style.color = "#ff0000";
msg.innerText = "Enter a code first.";
return;
}

if(!VALID_CODES.hasOwnProperty(code)){
msg.style.color = "#ff0000";
msg.innerText = "That code isn't valid.";
return;
}

appliedCode = code;
const value = VALID_CODES[code];

if(value === "freeship"){
freeShipping = true;
discountRate = 0;
msg.style.color = "#2ecc71";
msg.innerText = "Free shipping applied.";
} else {
discountRate = value;
freeShipping = false;
msg.style.color = "#2ecc71";
msg.innerText = Math.round(value * 100) + "% off applied.";
}

input.disabled = true;
document.getElementById("promoBtn").disabled = true;

updateTotal();

}

function updateTotal(){

const payBtn = document.getElementById("payBtn");

if(delivery.value === "outside"){

document.getElementById("total").innerText =
"Outside Lagos? Message us directly to arrange delivery.";

payBtn.innerText = "MESSAGE US";

return;

}

payBtn.innerText = "PAY NOW";

let deliveryFee = Number(delivery.value);

if(freeShipping){
deliveryFee = 0;
}

const discountAmount = Math.round(subtotal * discountRate);

const total = subtotal + deliveryFee - discountAmount;

if(discountAmount > 0 || freeShipping){

let html = "Subtotal: ₦" + subtotal.toLocaleString("en-NG") + "<br>";

if(discountAmount > 0){
html += "Discount: -₦" + discountAmount.toLocaleString("en-NG") + "<br>";
}

html += "Delivery: " + (freeShipping ? "FREE" : "₦" + deliveryFee.toLocaleString("en-NG")) + "<br>";

html += "<strong>TOTAL: ₦" + total.toLocaleString("en-NG") + "</strong>";

document.getElementById("total").innerHTML = html;

} else {

document.getElementById("total").innerText =
"TOTAL: ₦" + total.toLocaleString("en-NG");

}

}

delivery.addEventListener(
"change",
updateTotal
);

updateTotal();

function formatPrice(amount){
return "₦" + amount.toLocaleString("en-NG");
}

function showConfirmation(orderRef, transactionId){

const box = document.querySelector(".box");

box.innerHTML = `

<h1>PAYMENT SUCCESSFUL</h1>

<p style="color:#ccc; margin-top:10px;">
Thanks for your order! A confirmation email is on its way to you.
</p>

<div class="confirm-block">
<p>Order Reference</p>
<h2>${orderRef}</h2>
</div>

<div class="confirm-block">
<p>Transaction ID</p>
<h2>${transactionId}</h2>
</div>

<p style="color:#777; font-size:13px; margin-top:14px;">
Save this reference number for any order enquiries.
</p>

<a href="index.html" style="display:block;">
<button type="button" style="margin-top:20px;">BACK TO HOME</button>
</a>

`;

}

function payNow(){

if(cart.length === 0){
showToast("Your cart is empty.", "error");
return;
}

if(delivery.value === "outside"){

showToast("Thanks! We'll message you to arrange delivery.", "success");

setTimeout(function(){
window.location.href = "contact.html";
}, 1800);

return;

}

const firstName = document.getElementById("firstName").value.trim();
const lastName = document.getElementById("lastName").value.trim();
const email = document.getElementById("email").value.trim();
const phone = document.getElementById("phone").value.trim();
const address = document.getElementById("address").value.trim();

if(!firstName || !lastName || !email || !phone || !address){
showToast("Please fill in all fields before paying.", "error");
return;
}

let deliveryFee = Number(delivery.value);

if(freeShipping){
deliveryFee = 0;
}

const discountAmount = Math.round(subtotal * discountRate);
const total = subtotal + deliveryFee - discountAmount;

const orderRef = "VANDAL-" + Date.now();

FlutterwaveCheckout({

public_key: "FLWPUBK-3b34799c31afa84f90876a8a55afa1f0-X",

tx_ref: orderRef,

amount: total,

currency: "NGN",

payment_options: "card, banktransfer, ussd",

customer:{
email: email,
phone_number: phone,
name: firstName + " " + lastName
},

meta:{
address: address,
delivery_option: delivery.options[delivery.selectedIndex].text,
promo_code: appliedCode || "none",
discount_amount: discountAmount,
cart: JSON.stringify(cart)
},

customizations:{
title: "VANDAL",
description: "Payment for items in cart",
logo: "VANDAL LOGO.png"
},

callback: function(response){

if(response.status === "successful"){

const orderSummary = cart.map(function(item){
let line = item.name + " (" + item.color + ", " + item.size;
if(item.height){ line += ", " + item.height; }
line += ") - " + formatPrice(item.price);
return line;
}).join("\n");

emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
to_email: email,
customer_name: firstName + " " + lastName,
order_ref: orderRef,
transaction_id: response.transaction_id,
order_items: orderSummary,
order_total: formatPrice(total),
delivery_option: delivery.options[delivery.selectedIndex].text,
address: address
}).catch(function(err){
console.error("Order email failed to send:", err);
});

// Send yourself the same order details so you can see color/size/height
// picked, straight from your phone's email app.
emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
to_email: SELLER_EMAIL,
customer_name: firstName + " " + lastName + " (" + phone + ")",
order_ref: orderRef,
transaction_id: response.transaction_id,
order_items: orderSummary,
order_total: formatPrice(total),
delivery_option: delivery.options[delivery.selectedIndex].text,
address: address
}).catch(function(err){
console.error("Seller notification email failed to send:", err);
});

localStorage.removeItem("cart");

showConfirmation(orderRef, response.transaction_id);

}else{

showToast("Payment was not completed. Please try again.", "error");

}

},

onclose: function(){
// user closed the payment modal without completing payment
}

});

}

</script>

</body>
</html>
