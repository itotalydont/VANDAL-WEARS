<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VANDAL</title>

    <link rel="icon" href="VANDAL LOGO.png">
    <link rel="stylesheet" href="style.css">

    <!-- Load the intro first because it is the first thing visitors see -->
    <link
        rel="preload"
        as="image"
        href="intro.png"
        fetchpriority="high"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Creepster&display=swap"
        rel="stylesheet"
    >

<style>

/* =========================
   HOMEPAGE BACKGROUND
========================= */

.hero {
    background-image: none;
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
}


/*
   Don't make the phone download/render the large
   homepage background while the intro is still open.
*/

body.intro-complete .hero {
    background-image: url("background.png");
}


/* =========================
   TAP TO ENTER SCREEN
========================= */

#tapToEnter {
    position: fixed;

    inset: 0;

    width: 100%;

    height: 100dvh;
    min-height: 100vh;

    background: #fff;

    z-index: 200000;

    overflow: hidden;

    cursor: pointer;

    touch-action: manipulation;

    -webkit-tap-highlight-color: transparent;

    contain: layout paint;
}


/*
   Once the intro is finished,
   completely remove it from display.
*/

#tapToEnter.is-hidden {
    display: none;
}


/* =========================
   INTRO IMAGE
========================= */

.intro-half {
    position: absolute;

    inset-block: 0;

    width: 50%;
    height: 100%;

    background-image: url("intro.png");

    background-size: 200% 100%;

    background-repeat: no-repeat;

    /*
       Keep animation on the GPU where possible.
       This is much easier on mobile devices.
    */

    will-change: transform;

    transform: translate3d(0, 0, 0);

    transition:
        transform 0.72s
        cubic-bezier(0.76, 0, 0.24, 1);
}


.intro-left {
    left: 0;

    background-position: 0% 0%;
}


.intro-right {
    right: 0;

    background-position: 100% 0%;
}


/* =========================
   OPENING ANIMATION
========================= */

#tapToEnter.open .intro-left {
    transform: translate3d(-100%, 0, 0);
}


#tapToEnter.open .intro-right {
    transform: translate3d(100%, 0, 0);
}


/* =========================
   TAP TO ENTER TEXT
========================= */

#tapText {
    position: absolute;

    left: 50%;
    bottom: 14%;

    transform: translateX(-50%);

    font-size: 13px;

    letter-spacing: 4px;

    color: #000;

    z-index: 2;

    transition: opacity 0.25s ease;

    white-space: nowrap;
}


#tapText.hidden {
    opacity: 0;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .hero {
        min-height: calc(100svh - 80px);

        background-repeat: no-repeat;

        background-position: center center;

        background-size: cover;
    }


    #tapToEnter {
        height: 100dvh;

        min-height: 100svh;

        background: #fff;
    }


    /*
       Keep the same two-door appearance,
       but don't create a 200vw x 100svh
       rendering surface.
    */

    .intro-half {
        height: 100%;

        background-size: 200% 100%;
    }


    .intro-left {
        background-position: left center;
    }


    .intro-right {
        background-position: right center;
    }


    #tapText {
        bottom: 10%;

        font-size: 11px;

        letter-spacing: 3px;

        color: #000;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 480px) {

    .hero {
        min-height: calc(100svh - 70px);

        background-position: center center;

        background-size: cover;
    }


    #tapText {
        bottom: 8%;

        font-size: 10px;

        letter-spacing: 2.5px;

        color: #000;
    }

}

</style>

</head>


<body>


<!-- =========================
     TAP TO ENTER
========================= -->

<div id="tapToEnter">

    <div class="intro-half intro-left"></div>

    <div class="intro-half intro-right"></div>

    <div id="tapText">
        TAP TO ENTER
    </div>

</div>



<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar nav">

    <div class="logo">

        <img
            src="VANDAL LOGO.png"
            alt="VANDAL Logo"
            decoding="async"
        >

    </div>


    <button
        class="menu-toggle"
        onclick="toggleMenu()"
    >

        <span class="bars">
            <span></span>
            <span></span>
            <span></span>
        </span>

        MENU

    </button>


    <ul
        class="nav-links"
        id="navLinks"
    >

        <li>

            <a
                href="index.html"
                class="active"
            >
                Home
            </a>

        </li>


        <li>

            <a href="shop.html">
                Shop
            </a>

        </li>


        <li>

            <a href="contact.html">
                Contact
            </a>

        </li>


        <li>

            <a href="cart.html">
                Cart
            </a>

        </li>


        <li>

            <a href="unreleased.html">
                Unreleased
            </a>

        </li>

    </ul>

</nav>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        WELCOME TO THE ATELIER
    </h1>

    <p>
        VANDALISM IS FREEDOM.
    </p>


    <a href="shop.html">

        <button>
            ENTER ATELIER
        </button>

    </a>

</section>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="site.js"></script>


<script>

(function () {

    const splash =
        document.getElementById(
            "tapToEnter"
        );


    const tapText =
        document.getElementById(
            "tapText"
        );


    /*
       If for some reason the intro
       element doesn't exist, don't
       block the homepage.
    */

    if (!splash) {

        document.body.classList.add(
            "intro-complete"
        );

        return;
    }


    let hasPlayed = false;

    let removalTimer = null;



    /* =========================
       FINISH INTRO
    ========================= */

    function finishIntro() {

        if (!splash) {
            return;
        }


        splash.classList.add(
            "is-hidden"
        );


        splash.setAttribute(
            "aria-hidden",
            "true"
        );


        /*
           Now that the intro is gone,
           allow the homepage background
           to load.
        */

        document.body.classList.add(
            "intro-complete"
        );


        if (removalTimer) {

            clearTimeout(
                removalTimer
            );

        }

    }



    /* =========================
       OPEN DOORS
    ========================= */

    function openDoors() {

        /*
           Prevent double taps from
           playing the animation twice.
        */

        if (hasPlayed) {
            return;
        }


        hasPlayed = true;


        if (tapText) {

            tapText.classList.add(
                "hidden"
            );

        }


        splash.classList.add(
            "open"
        );


        /*
           Door animation is 0.72s.
           Remove splash immediately
           afterwards.
        */

        removalTimer =
            setTimeout(
                finishIntro,
                760
            );

    }



    /* =========================
       PHONE / MOUSE / STYLUS
    ========================= */

    /*
       Pointer events handle touch,
       mouse and stylus.

       This avoids running separate
       click AND touchstart handlers
       on mobile.
    */

    splash.addEventListener(
        "pointerup",
        openDoors,
        {
            passive: true
        }
    );



    /* =========================
       KEYBOARD ACCESSIBILITY
    ========================= */

    splash.setAttribute(
        "role",
        "button"
    );


    splash.setAttribute(
        "tabindex",
        "0"
    );


    splash.setAttribute(
        "aria-label",
        "Enter VANDAL"
    );


    splash.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                openDoors();

            }

        }
    );



    /* =========================
       SAFETY FALLBACK
    ========================= */

    /*
       IMPORTANT:

       If a slow/older phone has trouble
       with the intro for any reason,
       it will NEVER be allowed to block
       the website permanently.

       After 8 seconds the website is
       automatically revealed.
    */

    setTimeout(
        function () {

            if (!hasPlayed) {

                finishIntro();

            }

        },
        8000
    );



    /* =========================
       IMAGE FAILURE FALLBACK
    ========================= */

    /*
       If intro.png cannot load,
       don't leave the visitor staring
       at a blank white screen.
    */

    const introPreload =
        new Image();


    introPreload.onerror =
        function () {

            finishIntro();

        };


    introPreload.src =
        "intro.png";


})();

</script>


</body>

</html>
