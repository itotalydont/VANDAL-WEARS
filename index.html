<script src="site.js"></script>

<script>

// ---- Entrance lock settings ----
const LOCK_START_HOUR = 4; // 4:00 AM - lock turns on
const UNLOCK_HOUR = 16; // 4:00 PM - lock turns off
const ENTRANCE_CODE = "980378VNDL";
// ---------------------------------

let countdownTimer;

function isCurrentlyLocked(){
const hour = new Date().getHours();
return hour >= LOCK_START_HOUR && hour < UNLOCK_HOUR;
}

function unlockSite(){
sessionStorage.setItem("vandalUnlocked", "true");
document.getElementById("lockScreen").style.display = "none";
if(countdownTimer){
clearInterval(countdownTimer);
}
}

function tickCountdown(){

const el = document.getElementById("countdown");
const now = new Date();
const target = new Date();
target.setHours(UNLOCK_HOUR, 0, 0, 0);

const diff = target - now;

if(diff <= 0){
unlockSite();
return;
}

const h = Math.floor(diff / 3600000);
const m = Math.floor((diff % 3600000) / 60000);
const s = Math.floor((diff % 60000) / 1000);

el.textContent =
String(h).padStart(2,"0") + ":" +
String(m).padStart(2,"0") + ":" +
String(s).padStart(2,"0");

}

function checkCode(){

const input = document.getElementById("entryCode");
const msg = document.getElementById("codeMsg");
const value = input.value.trim().toUpperCase();

if(value === ENTRANCE_CODE){
unlockSite();
} else {
msg.textContent = "Incorrect code.";
}

}

document.getElementById("entryCode").addEventListener("keydown", function(e){
if(e.key === "Enter"){
checkCode();
}
});

// Once unlocked (by code or by the clock passing 4pm), stays unlocked
// only for this browsing session — closing the tab/browser will
// require the code again next time.
// Locked only between 4am and 4pm. Outside that window (4pm-4am),
// or once already unlocked this session, skip the gate entirely.
if(sessionStorage.getItem("vandalUnlocked") === "true" || !isCurrentlyLocked()){
unlockSite();
} else {
tickCountdown();
countdownTimer = setInterval(tickCountdown, 1000);
}

</script>
