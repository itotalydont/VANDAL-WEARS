<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDAL</title>
    <link rel="icon" href="VANDAL LOGO.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>

body{
margin:0;
background:#000000;
font-family:Arial;
color:rgb(255, 255, 255);
overflow-x:hidden;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
background:#000000;
border-bottom:2px solid rgba(95, 86, 86, 0);
}

.logo-wrap{
display:flex;
align-items:center;
gap:15px;
}

.logo-wrap img{
width:70px;
}

.logo-text{
font-family:'Creepster',cursive;
font-size:42px;
color:rgb(255, 254, 254);
letter-spacing:4px;
}

nav a{
color:white;
text-decoration:none;
margin-left:20px;
font-size:18px;
}

.hero{
height:90vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:80px;
font-family:'Creepster',cursive;
margin-bottom:10px;
color:rgb(255, 247, 247);
}

.hero p{
max-width:700px;
font-size:20px;
color:#ccc;
}

.hero button{
margin-top:30px;
padding:18px 40px;
background:rgb(222, 222, 222);
border:none;
border-radius:12px;
font-size:20px;
color:rgb(0, 0, 0);
cursor:pointer;
transition:0.3s;
}

.hero button:hover{
background:#ff0000;
transform:scale(1.05);
}

#lockScreen{
position:fixed;
inset:0;
background:
linear-gradient(rgba(0,0,0,0.78), rgba(0,0,0,0.78)),
url("VANDAL LOGO.png") no-repeat center center;
background-size:cover;
z-index:99999;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.lock-box{
text-align:center;
max-width:420px;
}

.lock-box h1{
font-family:'Creepster',cursive;
font-size:52px;
letter-spacing:4px;
color:#fff;
text-shadow:0 0 20px rgba(255,0,0,0.5);
margin-bottom:6px;
}

.lock-sub{
color:#999;
font-size:14px;
letter-spacing:1px;
text-transform:uppercase;
margin-bottom:22px;
}

#countdown{
font-family:Arial, Helvetica, sans-serif;
font-size:48px;
font-weight:bold;
letter-spacing:3px;
color:#ff0000;
text-shadow:0 0 25px rgba(255,0,0,0.55);
margin-bottom:30px;
}

.code-row{
display:flex;
gap:10px;
}

.code-row input{
flex:1;
min-width:0;
padding:14px 16px;
background:#161616;
border:2px solid #292929;
color:#fff;
border-radius:10px;
font-size:15px;
outline:none;
text-align:center;
letter-spacing:2px;
text-transform:uppercase;
transition:0.2s;
}

.code-row input:focus{
border-color:#ff0000;
}

.code-row button{
width:auto;
padding:14px 22px;
margin:0;
background:#ff0000;
color:#fff;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.code-row button:hover{
background:#fff;
color:#000;
}

#codeMsg{
min-height:18px;
margin-top:12px;
font-size:13px;
}

</style>

</head>

<body>

<div id="lockScreen">

<div class="lock-box">

<h1>VANDAL</h1>

<p class="lock-sub">Drop unlocks at 4:00 PM</p>

<div id="countdown">00:00:00</div>

<div class="code-row">
<input type="text" id="entryCode" placeholder="Entrance code">
<button onclick="checkCode()">ENTER</button>
</div>

<p id="codeMsg"></p>

</div>

</div>

<nav>

<div class="logo-wrap">
<img src="VANDAL LOGO.png">
<div class="logo-text">VANDAL</div>
</div>

<div>
<a href="shop.html">Shop</a>
<a href="cart.html">Cart</a>
</div>

</nav>

<section class="hero">

<h1>WELCOME TO THE ATELIER</h1>

<p>
BREAK RULES BUILD LEGACY.
</p>

<a href="shop.html">
<button>ENTER ATELIER</button>
</a>

</section>

<script>

// ---- Entrance lock settings ----
const UNLOCK_HOUR = 16; // 4:00 PM, 24-hour clock, visitor's local time
const ENTRANCE_CODE = "109387MSCHF";
// ---------------------------------

let countdownTimer;

function isPastUnlockTime(){
return new Date().getHours() >= UNLOCK_HOUR;
}

function unlockSite(){
sessionStorage.setItem("vandalUnlocked", "true");
document.getElementById("lockScreen").style.display = "none";
if(countdownTimer){
clearInterval(countdownTimer);
}
}

function tickCountdown(){

const el = document.getElementById("countdown");
const now = new Date();
const target = new Date();
target.setHours(UNLOCK_HOUR, 0, 0, 0);

const diff = target - now;

if(diff <= 0){
unlockSite();
return;
}

const h = Math.floor(diff / 3600000);
const m = Math.floor((diff % 3600000) / 60000);
const s = Math.floor((diff % 60000) / 1000);

el.textContent =
String(h).padStart(2,"0") + ":" +
String(m).padStart(2,"0") + ":" +
String(s).padStart(2,"0");

}

function checkCode(){

const input = document.getElementById("entryCode");
const msg = document.getElementById("codeMsg");
const value = input.value.trim().toUpperCase();

if(value === ENTRANCE_CODE){
unlockSite();
} else {
msg.style.color = "#ff0000";
msg.textContent = "Incorrect code.";
}

}

document.getElementById("entryCode").addEventListener("keydown", function(e){
if(e.key === "Enter"){
checkCode();
}
});

// Once unlocked (by code or by the clock passing 4pm), stays unlocked
// only for this browsing session — closing the tab/browser will
// require the code again next time.
if(sessionStorage.getItem("vandalUnlocked") === "true" || isPastUnlockTime()){
unlockSite();
} else {
tickCountdown();
countdownTimer = setInterval(tickCountdown, 1000);
}

</script>

</body>
</html>
