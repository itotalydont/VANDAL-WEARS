<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VANDAL</title>

    <link rel="icon" href="VANDAL LOGO.png">
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">

<style>

/* =========================
   HOMEPAGE BACKGROUND
========================= */

.hero {
    background-image: url("background.png");
    background-repeat: no-repeat;
    background-position: center center;
    background-size: cover;
}


/* =========================
   TAP TO ENTER SCREEN
========================= */

#tapToEnter {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 200000;
    overflow: hidden;
    cursor: pointer;
}


/* =========================
   INTRO IMAGE
========================= */

.intro-half {
    position: absolute;
    top: 0;

    width: 50%;
    height: 100%;

    background-image: url("intro.png");
    background-size: 200% 100%;
    background-repeat: no-repeat;

    transition:
        transform 0.85s
        cubic-bezier(0.76, 0, 0.24, 1);
}


.intro-left {
    left: 0;
    background-position: 0% 0%;
}


.intro-right {
    right: 0;
    background-position: 100% 0%;
}


/* =========================
   OPENING ANIMATION
========================= */

#tapToEnter.open .intro-left {
    transform: translateX(-100%);
}


#tapToEnter.open .intro-right {
    transform: translateX(100%);
}


/* =========================
   TAP TO ENTER TEXT
========================= */

#tapText {
    position: absolute;

    left: 50%;
    bottom: 14%;

    transform: translateX(-50%);

    font-size: 13px;
    letter-spacing: 4px;

    color: #000;

    z-index: 2;

    transition: opacity 0.25s ease;

    white-space: nowrap;
}


#tapText.hidden {
    opacity: 0;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {

    .hero {
        min-height: calc(100svh - 80px);

        background-image: url("background.png");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: cover;
    }


    #tapToEnter {
        width: 100vw;
        height: 100svh;

        background: #fff;
    }


    .intro-half {
        height: 100svh;

        background-size: 200vw 100svh;
    }


    .intro-left {
        background-position: left center;
    }


    .intro-right {
        background-position: right center;
    }


    #tapText {
        bottom: 10%;

        font-size: 11px;
        letter-spacing: 3px;

        color: #000;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 480px) {

    .hero {
        min-height: calc(100svh - 70px);

        background-position: center center;
        background-size: cover;
    }


    #tapText {
        bottom: 8%;

        font-size: 10px;
        letter-spacing: 2.5px;

        color: #000;
    }

}

</style>

</head>


<body>


<!-- =========================
     TAP TO ENTER
========================= -->

<div id="tapToEnter">

    <div class="intro-half intro-left"></div>

    <div class="intro-half intro-right"></div>

    <div id="tapText">
        TAP TO ENTER
    </div>

</div>



<!-- =========================
     NAVIGATION
========================= -->

<nav class="navbar nav">

    <div class="logo">

        <img
            src="VANDAL LOGO.png"
            alt="VANDAL Logo"
        >

    </div>


    <button
        class="menu-toggle"
        onclick="toggleMenu()"
    >

        <span class="bars">
            <span></span>
            <span></span>
            <span></span>
        </span>

        MENU

    </button>


    <ul
        class="nav-links"
        id="navLinks"
    >

        <li>
            <a
                href="index.html"
                class="active"
            >
                Home
            </a>
        </li>

        <li>
            <a href="shop.html">
                Shop
            </a>
        </li>

        <li>
            <a href="contact.html">
                Contact
            </a>
        </li>

        <li>
            <a href="cart.html">
                Cart
            </a>
        </li>

        <li>
            <a href="unreleased.html">
                Unreleased
            </a>
        </li>

    </ul>

</nav>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        WELCOME TO THE ATELIER
    </h1>

    <p>
        VANDALISM IS FREEDOM.
    </p>

    <a href="shop.html">

        <button>
            ENTER ATELIER
        </button>

    </a>

</section>



<!-- =========================
     JAVASCRIPT
========================= -->

<script src="site.js"></script>


<script>

(function () {

    const splash =
        document.getElementById("tapToEnter");

    const tapText =
        document.getElementById("tapText");

    let hasPlayed = false;


    function openDoors() {

        if (hasPlayed) {
            return;
        }

        hasPlayed = true;

        tapText.classList.add("hidden");

        splash.classList.add("open");


        setTimeout(function () {

            splash.style.display = "none";

        }, 900);

    }


    splash.addEventListener(
        "click",
        openDoors
    );


    splash.addEventListener(
        "touchstart",
        openDoors,
        {
            passive: true
        }
    );

})();

</script>


</body>

</html>
