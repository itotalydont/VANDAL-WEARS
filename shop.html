<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VANDAL SHOP</title>
    <link rel="icon" href="VANDAL LOGO.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
</head>

<body>

<nav class="navbar nav">

<div class="logo">
<img src="VANDAL LOGO.png" alt="VANDAL Logo">
<span>VANDAL</span>
</div>

<button class="menu-toggle" onclick="toggleMenu()">
<span class="bars"><span></span><span></span><span></span></span>
MENU
</button>

<ul class="nav-links" id="navLinks">
<li><a href="index.html">Home</a></li>
<li><a href="shop.html" class="active">Shop</a></li>
<li><a href="contact.html">Contact</a></li>
<li><a href="cart.html">Cart</a></li>
<li><a href="unreleased.html">Unreleased</a></li>
</ul>

</nav>

<div class="search-wrap">
<input type="text" id="searchInput" placeholder="Search products..." oninput="renderProducts()">
</div>

<div class="products" id="products"></div>

<script src="products.js"></script>
<script src="site.js"></script>

<script>

const container = document.getElementById("products");

function renderProducts(){

const query =
document.getElementById("searchInput").value.trim().toLowerCase();

container.innerHTML = "";

let matchCount = 0;

PRODUCTS.forEach(function(p, index){

if(query && !p.name.toLowerCase().includes(query)){
return;
}

matchCount++;

const swatches = p.colors.slice(0, 6).map(function(c){
return '<div class="dot" style="background:' + guessColor(c) + '"></div>';
}).join("");

container.innerHTML += `

<a class="product-card" href="product.html?id=${index}">

<img src="${p.colors[0]}" alt="${p.name}">

<div class="product-card-info">
<h3>${p.name}</h3>
<div class="price">${formatPrice(p.price)}</div>
<div class="swatch-preview">${swatches}</div>
</div>

</a>

`;

});

if(matchCount === 0){
container.innerHTML =
`<div class="no-results">No products match "${document.getElementById("searchInput").value}".</div>`;
}

}

if(typeof PRODUCTS === "undefined"){
container.innerHTML =
'<div class="no-results">Products failed to load. Make sure products.js is uploaded in the same folder as this page.</div>';
} else {
renderProducts();
}

</script>

</body>
</html>
